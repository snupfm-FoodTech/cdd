<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>인증번호</title>
    <style>
        .custom-code {
            background-color: #d3d3d3;
            padding: 5px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p>안녕하세요. 맞춤형식이설계 공공플랫폼 입니다.</p>
    <p>인증번호는 다음과 같습니다.</p>
    <p><span class="custom-code" th:text="${authNo}">[authNo]</span></p>
	<p>위의 인증번호를 입력하시면</p>
	<p>인증이 정상적으로 완료됩니다.</p>
	<p>감사합니다.</p>
</body>
</html>
