# custom-diet nginx 설정
events {
  worker_connections 1024;
}

http {
  upstream custom-diet-api {
    server custom-diet-api:8080;
  }

  upstream custom-diet-front {
    server custom-diet-front:3000;
  }

  upstream custom-diet-front-static {
    server custom-diet-front:4000;
  }

  # HTTP → HTTPS redirect
  server {
    listen 80;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name _;  # 서버 IP/도메인에 맞춰 변경

    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api {
      proxy_pass http://custom-diet-api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://custom-diet-front;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /service-page/ {
      proxy_pass http://custom-diet-front-static/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /env.js {
      proxy_pass http://custom-diet-front-static;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /service-page {
      return 301 /service-page/;
    }
  }
}
